<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lilmoo Fullscreen Game</title>
    <style>
        * { padding: 0; margin: 0; box-sizing: border-box; }
        body, html { 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background: #1a1a1a; 
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas { 
            background: #2c3e50; 
            display: block; 
            touch-action: none; /* ስክሪኑ እንዳይላወስ */
        }
        #ui-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #00f2fe;
            font-family: Arial, sans-serif;
            font-weight: bold;
            pointer-events: none; /* በጽሁፉ ላይ ክሊክ እንዳይደረግ */
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        #fullscreen-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            padding: 10px 15px;
            background: rgba(255, 215, 0, 0.7);
            border: none;
            border-radius: 5px;
            color: black;
            font-weight: bold;
            cursor: pointer;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <div id="scoreLabel">ውጤት: 0</div>
        <div id="stageLabel">Stage: 1</div>
    </div>

    <button id="fullscreen-btn" onclick="toggleFullscreen()">Full Screen</button>
    <canvas id="myCanvas"></canvas>

<script>
    var canvas = document.getElementById("myCanvas");
    var ctx = canvas.getContext("2d");

    // ካንቫሱ ስክሪኑን እንዲሞላ ማድረግ
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        resetLevel(); // ስክሪኑ ሲቀየር ኳሷ እንዳትጠፋ
    }
    window.addEventListener('resize', resizeCanvas);
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    var ballRadius = 12;
    var x, y, dx, dy;
    var paddleHeight = 15;
    var paddleWidth = canvas.width / 4; // መቅዘፊያው ከስክሪኑ ጋር እንዲመጣጠን
    var paddleX;
    
    var stage = 1;
    var speedBase = 3; 
    var score = 0;

    // የጡቦች ቅንብር
    var brickRowCount = 3;
    var brickColumnCount = 5;
    var brickPadding = 10;
    var brickOffsetTop = 60;
    var brickOffsetLeft = 20;
    var bricks = [];

    function initBricks() {
        var totalPadding = brickPadding * (brickColumnCount - 1);
        var availableWidth = canvas.width - (brickOffsetLeft * 2) - totalPadding;
        var brickWidth = availableWidth / brickColumnCount;
        var brickHeight = 25;

        bricks = [];
        for (var c = 0; c < brickColumnCount; c++) {
            bricks[c] = [];
            for (var r = 0; r < brickRowCount; r++) {
                bricks[c][r] = { 
                    x: (c * (brickWidth + brickPadding)) + brickOffsetLeft, 
                    y: (r * (brickHeight + brickPadding)) + brickOffsetTop, 
                    status: 1,
                    width: brickWidth,
                    height: brickHeight
                };
            }
        }
    }

    function resetLevel() {
        x = canvas.width / 2;
        y = canvas.height - 40;
        dx = speedBase + (stage * 0.5);
        dy = -(speedBase + (stage * 0.5));
        paddleX = (canvas.width - paddleWidth) / 2;
        paddleWidth = canvas.width / 4; 
        initBricks();
    }

    // መቆጣጠሪያዎች
    document.addEventListener("touchmove", function(e) {
        e.preventDefault();
        var touch = e.touches[0];
        var relativeX = touch.clientX - canvas.offsetLeft;
        if(relativeX > 0 && relativeX < canvas.width) {
            paddleX = relativeX - paddleWidth / 2;
        }
    }, { passive: false });

    document.addEventListener("mousemove", function(e) {
        var relativeX = e.clientX - canvas.offsetLeft;
        if(relativeX > 0 && relativeX < canvas.width) {
            paddleX = relativeX - paddleWidth / 2;
        }
    });

    function collisionDetection() {
        for (var c = 0; c < brickColumnCount; c++) {
            for (var r = 0; r < brickRowCount; r++) {
                var b = bricks[c][r];
                if (b.status == 1) {
                    if (x > b.x && x < b.x + b.width && y > b.y && y < b.y + b.height) {
                        dy = -dy;
                        b.status = 0;
                        score++;
                        document.getElementById("scoreLabel").innerHTML = "ውጤት: " + score;
                        
                        if (score == brickRowCount * brickColumnCount) {
                            stage++;
                            document.getElementById("stageLabel").innerHTML = "Stage: " + stage;
                            if(brickRowCount < 6) brickRowCount++; 
                            alert("Stage " + (stage-1) + " ተጠናቋል!");
                            score = 0;
                            resetLevel();
                        }
                    }
                }
            }
        }
    }

    function drawBall() {
        ctx.beginPath();
        ctx.arc(x, y, ballRadius, 0, Math.PI * 2);
        ctx.fillStyle = "#ff4d4d";
        ctx.fill();
        ctx.shadowBlur = 10;
        ctx.shadowColor = "#ff4d4d";
        ctx.closePath();
    }

    function drawPaddle() {
        ctx.beginPath();
        ctx.rect(paddleX, canvas.height - paddleHeight - 5, paddleWidth, paddleHeight);
        ctx.fillStyle = "#ffffff";
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.closePath();
    }

    function drawBricks() {
        for (var c = 0; c < brickColumnCount; c++) {
            for (var r = 0; r < brickRowCount; r++) {
                if (bricks[c][r].status == 1) {
                    var b = bricks[c][r];
                    ctx.beginPath();
                    ctx.rect(b.x, b.y, b.width, b.height);
                    ctx.fillStyle = "#ffd700";
                    ctx.fill();
                    ctx.closePath();
                }
            }
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawBricks();
        drawBall();
        drawPaddle();
        collisionDetection();

        if (x + dx > canvas.width - ballRadius || x + dx < ballRadius) dx = -dx;
        if (y + dy < ballRadius) dy = -dy;
        else if (y + dy > canvas.height - ballRadius - 5) {
            if (x > paddleX && x < paddleX + paddleWidth) {
                dy = -dy;
            } else {
                alert("GAME OVER!");
                stage = 1;
                score = 0;
                brickRowCount = 3;
                document.getElementById("scoreLabel").innerHTML = "ውጤት: 0";
                document.getElementById("stageLabel").innerHTML = "Stage: 1";
                resetLevel();
            }
        }

        x += dx;
        y += dy;
        requestAnimationFrame(draw);
    }

    function toggleFullscreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen();
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    }

    resetLevel();
    draw();
</script>
</body>
</html>
